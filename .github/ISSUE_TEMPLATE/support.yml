name: Health Reminders support request
description: Report a problem or ask a question about Health Reminders
title: "Support: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contacting Health Reminders support.

        This request will be public. Do not include medical details, provider information, phone numbers, addresses, or other personal information.
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - iPhone
        - iPad
        - Mac
        - More than one device
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: iOS, iPadOS, or macOS version
      placeholder: Example: iOS 18.6
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: How can we help?
      description: Describe the issue without including health or personal information.
    validations:
      required: true
