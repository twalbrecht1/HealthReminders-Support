name: Health Reminders feedback
description: Share an idea or tell us about your experience with Health Reminders
title: "Feedback: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Health Reminders.

        This feedback will be public. Do not include medical details, provider information, phone numbers, addresses, or other personal information.
  - type: dropdown
    id: feedback-type
    attributes:
      label: Feedback type
      options:
        - Feature idea
        - Improvement
        - General feedback
    validations:
      required: true
  - type: dropdown
    id: experience
    attributes:
      label: Overall experience
      options:
        - Excellent
        - Good
        - Okay
        - Needs improvement
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to share?
      description: Describe your idea or experience without including health or personal information.
    validations:
      required: true
